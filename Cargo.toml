[package]
name         = "sema-engine"
version      = "0.2.3"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/sema-engine"
description  = "Typed database operation engine over sema and signal-sema"
publish      = false

[lib]
name = "sema_engine"
path = "src/lib.rs"

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema = { git = "https://github.com/LiGoldragon/sema.git", branch = "main" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main", default-features = false }
signal-sema = { git = "https://github.com/LiGoldragon/signal-sema.git", branch = "main", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = { level = "warn", priority = -1 }
